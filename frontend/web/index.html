    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- An SVG icon and no .ico fallback: every browser this product targets
         reads SVG favicons, and a second binary file would be a copy that can
         drift from the brand colours the first one carries. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#1d6b45" />

  </head>
