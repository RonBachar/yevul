project_id = "yevul"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
# yevul:// היא כתובת החזרה האמיתית של הנייד, והיא זו שתעבוד בהפצה.
#
# הכתובת exp://localhost:8081/--/ קיימת אך ורק לפיתוח מול Expo Go.
# ב-Expo Go הפונקציה Linking.createURL מחזירה exp:// ולא yevul://, כי
# הסכמה yevul רשומה במערכת ההפעלה רק לבילד משלנו, ו-Expo Go היא
# אפליקציה אחרת שהסכמה שלה היא exp. בלי ההיתר הזה Supabase דוחה את
# כתובת החזרה בשקט ונופל חזרה ל-site_url, שהוא כתובת הווב, והמכשיר
# מנסה להגיע ל-localhost של עצמו ונכשל.
#
# למה כתובת מדויקת ולא תבנית. התבניות של Supabase לא חוצות נקודות
# ולוכסנים, נבדק בפועל מול השרת: exp://** אכן מתאים ל-exp://abc אבל
# לא ל-exp://192.168.1.104:8081/--/. לכן במקום להילחם בתבנית, מריצים
# את Metro במצב localhost עם גשר USB, וכך הכתובת קבועה ולא תלויה
# ב-IP שמשתנה. הפקודות נמצאות ב-docs/env.md.
#
# אזהרה, השורה עם exp היא לפיתוח מקומי בלבד ואין להעביר אותה לרשימת
# ההיתרים של פרודקשן. לפני השקה עוברים ל-development build ואז
# yevul:// לבדה מספיקה גם בפיתוח.
additional_redirect_urls = [
  "http://localhost:5173",
  "yevul://",
  "yevul://**",
  # Expo מפרסם hostUri בתור 127.0.0.1 כשמריצים עם --localhost, אבל
  # גרסאות שונות מפרסמות גם localhost, ולכן שתי הצורות רשומות.
  "exp://127.0.0.1:8081/--/",
  "exp://localhost:8081/--/",
]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"

[storage]
enabled = true
